name: My MCP Servers
version: 0.0.1
schema: v1
mcpServers:
  - name: web-search
    command: node
    args:
      - D:/LocalAI/web-search-mcp/dist/index.js

  - name: playwright
    command: npx
    args:
      - -y
      - "@playwright/mcp@latest"

  - name: rss-fetching
    command: npx
    args:
      - -y
      - rss-reader-mcp

  - name: github
    command: node
    args:
      - D:/LocalAI/node_modules/@modelcontextprotocol/server-github/dist/index.js
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: YOUR_NEW_TOKEN_HERE

  - name: context7
    command: npx
    args:
      - -y
      - "@upstash/context7-mcp"


  - name: memory
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-memory"

  - name: sequential-thinking
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"